name: Regional Charts

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  regional:

    runs-on:
      ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        region:
          - americas
          - europe
          - asia
          - mea

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run regional scraper
        run: node regional-${{ matrix.region }}.js

      - name: Commit JSON
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add *.json

          git diff --cached --quiet || git commit -m "update regional ${{ matrix.region }}"

          git push
