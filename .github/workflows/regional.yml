name: Regional Charts

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

jobs:

  americas:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npx playwright install chromium

      - run: node regional-americas.js

      - name: Upload Americas
        uses: actions/upload-artifact@v4
        with:
          name: americas
          path: |
            regional-americas.json
            chart-dates-americas.json


  europe:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npx playwright install chromium

      - run: node regional-europe.js

      - name: Upload Europe
        uses: actions/upload-artifact@v4
        with:
          name: europe
          path: |
            regional-europe.json
            chart-dates-europe.json


  asia:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npx playwright install chromium

      - run: node regional-asia.js

      - name: Upload Asia
        uses: actions/upload-artifact@v4
        with:
          name: asia
          path: |
            regional-asia.json
            chart-dates-asia.json


  mea:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npx playwright install chromium

      - run: node regional-mea.js

      - name: Upload MEA
        uses: actions/upload-artifact@v4
        with:
          name: mea
          path: |
            regional-mea.json
            chart-dates-mea.json


  commit:
    needs:
      - americas
      - europe
      - asia
      - mea

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download Americas
        uses: actions/download-artifact@v4
        with:
          name: americas

      - name: Download Europe
        uses: actions/download-artifact@v4
        with:
          name: europe

      - name: Download Asia
        uses: actions/download-artifact@v4
        with:
          name: asia

      - name: Download MEA
        uses: actions/download-artifact@v4
        with:
          name: mea

      - name: Move files
        run: |
          mv regional-americas.json .
          mv chart-dates-americas.json .

          mv regional-europe.json .
          mv chart-dates-europe.json .

          mv regional-asia.json .
          mv chart-dates-asia.json .

          mv regional-mea.json .
          mv chart-dates-mea.json .

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          git diff --cached --quiet || git commit -m "update regional"

          git push
