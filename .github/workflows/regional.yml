name: Regional Charts

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

jobs:

  americas:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run scraper
        run: node regional-americas.js

      - name: Commit JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          git diff --cached --quiet || git commit -m "update americas"

          success=false

          until [ "$success" = true ]; do

            git fetch origin

            LOCAL=$(git rev-parse HEAD)
            REMOTE=$(git rev-parse origin/main)

            if [ "$LOCAL" = "$REMOTE" ]; then

              echo "Safe to push 😍"

              if git push; then
                success=true
              fi

            else

              echo "Someone pushed first 😭 waiting..."

              git pull --rebase origin main

              sleep 20

            fi

          done

